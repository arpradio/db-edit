<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Music Database Editor</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-body">
    <form class="login-card" id="loginForm" autocomplete="on">
        <img src="/arpradio.png" alt="" class="login-logo">
        <h1>Music Database Editor</h1>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <div class="login-error" id="loginError" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary" id="loginButton">Sign in</button>
    </form>
    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        const button = document.getElementById('loginButton');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.hidden = true;
            button.disabled = true;
            button.textContent = 'Signing in...';
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username.value,
                        password: form.password.value
                    })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
                location.replace('/');
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.hidden = false;
                form.password.value = '';
                form.password.focus();
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
